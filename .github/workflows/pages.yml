# Publish ./pages to GitHub Pages.
#
# Today ./pages is the static HTML mockup of the campus (see mockups/README.md).
# When the Rust/Yew app lands (docs/plan.md, saga step pages-deploy) this
# workflow gains a Trunk build step and uploads dist/ instead.
name: Pages

on:
  push:
    branches: [main]
    paths: ['pages/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deploy midway; queue instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages
      - id: deploy
        uses: actions/deploy-pages@v4
