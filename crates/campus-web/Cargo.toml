[package]
name = "campus-web"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false
build = "build.rs"

[dependencies]
campus-docent = { path = "../campus-docent" }
campus-model = { path = "../campus-model" }
campus-scene = { path = "../campus-scene" }
campus-ui-chrome = { path = "../campus-ui-chrome" }
campus-ui-exhibits = { path = "../campus-ui-exhibits" }
campus-ui-docent = { path = "../campus-ui-docent" }
campus-ui-scene = { path = "../campus-ui-scene" }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Document", "Window"] }
yew = { version = "0.21", features = ["csr"] }
yew-router = "0.18"

[lints]
workspace = true
