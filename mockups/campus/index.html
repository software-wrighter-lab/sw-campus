    repos: [['sw-ml-study/demo-functional-pipelines','readable functional pipelines'],['sw-ml-study/demo-combinators','the combinator aviary'],['sw-ml-study/demo-design-patterns','GoF patterns, functionally']] },

  'extensions-integrations': { kind: 'Wing', title: 'Extensions & Integrations', status: 'open',

    repos: [['sw-ml-study/demo-extensions','dynamically loaded Rust extensions and native apps'],['sw-ml-study/demo-file-processing','hexdump, WAV, MP3/ID3, Ogg, streaming'],['sw-ml-study/demo-mlpl-libraries','shareable MLPL modules']] },

    summary: 'Every repository in the organisation, including the reading-shelf forks that are not exhibits.' },

  'math-through-ages':     { kind: 'Lobby exhibit', title: 'Mathematics Through the Ages', status: 'soon', tagline: 'Ideas · Notation · Machines · Insight' },

  // ---- Other campus places ----
  'hardware-lab':          { kind: 'Building', title: 'Hardware Lab', status: 'soon', tagline: 'FPGA · SoCs · MCUs · Prototyping · Test & Measurement · Experimental Systems' },
  'digital-media':         { kind: 'Building', title: 'Digital Media Studio', status: 'soon', tagline: 'Video · Audio · Speech · Music Generation · Editing · SFX · Voice Cloning · Generative Media' },
  'interactive-computing': { kind: 'Building', title: 'Interactive Computing Lab', status: 'soon', tagline: 'Games · Graphics · Visualization · Simulations · Interactive Demos · Educational Tools' },
  commons:     { kind: 'Landmark', title: 'The Commons', status: 'soon', tagline: 'Ideas meet here.' },
  'future-nw': { kind: 'Site', title: 'Future Building', status: 'soon', tagline: 'New ideas coming soon.' },
  'future-ne': { kind: 'Site', title: 'Future Building', status: 'soon', tagline: 'New ideas coming soon.' },
  'future-sw': { kind: 'Site', title: 'Future Building', status: 'soon', tagline: 'New ideas coming soon.' },
};

// ---------- Scenes: where things are drawn (1536 x 1024 image space) ----------
const SCENES = {
  campus: { image: 'images/campus.webp', alt: 'Painted map of the Software Wrighter Research Campus', hotspots: [
    ['computer-history', 575,130,385,210], ['computer-science', 285,250,280,230], ['hardware-lab', 950,250,350,220],
    ['computational-sciences', 230,480,390,260], ['digital-media', 620,600,290,230], ['interactive-computing', 1050,460,390,250],
    ['commons', 700,400,180,130], ['future-nw', 60,210,270,150], ['future-ne', 1290,230,230,140], ['future-sw', 20,760,310,150],
  ]},
  lobby: { image: 'images/lobby.webp', alt: 'Painted lobby of the Computer History Museum with its directory board', hotspots: [
    ['ibm-1130', 577,375,193,24], ['ibm-360', 577,404,193,24], ['ibm-370', 577,433,193,24], ['ibm-390', 577,462,193,24],
    ['early-computers', 577,492,193,24], ['personal-computing', 577,522,193,24],
    ['processors', 792,375,183,24], ['interfaces-media', 792,404,183,24], ['minicomputers', 792,433,183,24],
    ['game-machines', 792,462,183,24], ['special-exhibits', 792,492,183,24], ['library-archives', 792,522,183,24],
    ['vacuum-tubes', 30,700,205,200], ['transistors', 295,720,195,180], ['punch-cards', 300,610,160,110],
    ['core-memory', 460,640,140,150], ['paper-tape', 1000,640,160,150], ['early-pcs', 1170,690,200,160],
  ]},
  'cs-lobby': { image: 'images/cs-lobby.webp', alt: 'Painted lobby of the Computer Science Building with the sw-embed project directory', hotspots: [
    ['cpu-architectures', 524,213,438,40], ['language-experiments', 524,257,438,40], ['operating-systems', 524,301,438,40],
    ['emulators-simulators', 524,345,438,40], ['hardware-interfaces', 524,389,438,40], ['development-tools', 524,433,438,40],
    ['demos-experiments', 524,477,438,40], ['all-sw-embed', 524,521,438,36],
    ['cpus-through-ages', 0,640,410,190], ['interfaces-peripherals', 1150,640,386,200],
    ['information-desk', 500,620,580,110], ['featured-projects', 1355,405,181,195],
  ]},
  'csi-lobby': { image: 'images/csi-lobby.webp', alt: 'Painted lobby of the Computational Sciences Institute with the sw-ml-study project directory', hotspots: [
    ['sw-mlpl', 582,338,322,40], ['mathematics-foundation', 582,383,322,40], ['category-theory', 582,428,322,40],
    ['ml-utilities', 582,473,322,40], ['algorithms-data-structures', 582,518,322,40], ['functional-pipelines', 582,563,322,40],
    ['extensions-integrations', 582,608,322,40], ['all-sw-ml-study', 582,653,322,40],
    ['math-through-ages', 20,780,380,180], ['patterns-fountain', 620,720,390,110],
    ['theory-to-reality', 1150,760,386,200], ['visualization-theater', 1160,570,220,130],
  ]},
};
const W = 1536, H = 1024;

// ---------- Hierarchy derived from children (a place never stores its parent) ----------
const PARENT = {};
for (const [id, p] of Object.entries(PLACES)) (p.children || []).forEach(c => { PARENT[c] = id; });
function chainOf(id) { const out = []; for (let cur = id; cur; cur = PARENT[cur]) out.unshift(cur); return out; }
function pathOf(id) { return id === 'campus' ? '#/' : '#/campus/' + chainOf(id).slice(1).join('/'); }
function parentOf(id) { return PARENT[id] || null; }

// ---------- Routing: #/campus/computer-science/cpu-architectures ----------
function current() {
  const segs = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean);
  if (segs[0] === 'campus') segs.shift();
  const id = segs.length ? segs[segs.length - 1] : 'campus';
  const valid = PLACES[id] && chainOf(id).slice(1).join('/') === segs.join('/');
  return { id: valid ? id : null, chain: valid ? chainOf(id) : ['campus'] };
}

// ---------- Rendering ----------
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function renderCrumbs(chain) {
  const parts = [];
  chain.forEach((id, i) => {
    const label = id === 'campus' ? 'Campus' : PLACES[id].title;
    if (i < chain.length - 1) parts.push(`<a href="${pathOf(id)}">${esc(label)}</a><span class="sep">›</span>`);
    else parts.push(`<span class="here">${esc(label)}</span>`);
  });
  parts.push(`<span class="keys"><kbd>Esc</kbd> up &nbsp; <kbd>H</kbd> campus</span>`);
  document.getElementById('crumbs').innerHTML = parts.join('');
}

function chip(p) {
  return p.status === 'open' ? '<span class="chip open">Open</span>' : '<span class="chip soon">Opening soon</span>';
}

function renderScene(id, place) {
  const sc = SCENES[place.scene];
  const hots = sc.hotspots.map(([hid, x, y, w, h]) => {
    const p = PLACES[hid];
    const pts = `${x},${y} ${x+w},${y} ${x+w},${y+h} ${x},${y+h}`;
    return `<a class="hot ${p.status === 'open' ? '' : 'soon'}" href="${pathOf(hid)}" role="link" aria-label="${esc(p.title)}"
      data-id="${hid}" data-cx="${x + w/2}" data-by="${y + h}"><polygon points="${pts}"></polygon></a>`;
  }).join('');
  const dir = place.children.map(cid => `<li><a href="${pathOf(cid)}">${esc(PLACES[cid].title)}</a>${chip(PLACES[cid])}</li>`).join('');
  return `
    <div class="scene" id="scene">
      <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="${esc(sc.alt)}">
        <image href="${sc.image}" width="${W}" height="${H}"></image>
        ${hots}
      </svg>
      <div class="caption" id="caption" hidden></div>
    </div>
    <section class="dir" aria-label="Directory">
      <h2>${id === 'campus' ? 'On the campus' : 'Directory'}</h2>
      <ul>${dir}</ul>
    </section>`;
}

function renderPage(id, place) {
  const demos = (place.demos || []).map(d => `
    <li><span class="name">${esc(d.name)}<small>${esc(d.repo)} · ${esc(d.note)}</small></span>
        <a class="run" href="${d.url}" target="_blank" rel="noopener">Run demo</a></li>`).join('');
  const repos = (place.repos || []).map(([r, note]) => `
    <li><a href="${GH + r}" target="_blank" rel="noopener">${esc(r)}</a> <span>· ${esc(note)}</span></li>`).join('');
  const exhibits = (place.exhibits || []).map(([slug, title]) => `
    <li><span>${esc(title)}</span><span class="chip ph">${esc(slug)} · planned</span></li>`).join('');
  const parent = parentOf(id);
  const prose = place.summary
    ? `<p class="draft"><span class="chip draft">Draft</span>${esc(place.summary)}</p>`
    : `<div class="placeholder"><span class="chip soon">Placeholder</span>
        This is where the ${esc(place.kind.toLowerCase())}'s story goes: what it holds, why it matters,
        and what was built here. The real text is written when the exhibits are installed.</div>`;
  const external = place.external
    ? `<p><a class="run" href="${place.external.url}" target="_blank" rel="noopener">${esc(place.external.label)}</a></p>` : '';
  return `
    <article class="page">
      <div class="eyebrow">${esc(place.kind)} · ${esc(parent === 'campus' ? 'Campus' : PLACES[parent].title)}</div>
      <h1>${esc(place.title)}</h1>
      <p class="tagline">${esc(place.tagline)}</p>
      <div class="cols">
        <div class="prose">
          ${prose}
          ${external}
          ${exhibits ? `<div class="section exhibits"><h2>Exhibits in this wing</h2><ul>${exhibits}</ul></div>` : ''}
        </div>
        <div>
          <div class="section demos">
            <h2>Live demos</h2>
            ${demos ? `<ul>${demos}</ul>` : `<p class="placeholder"><span class="chip soon">Opening soon</span>No live demo installed yet.</p>`}
          </div>
          ${repos ? `<div class="section repos"><h2>Source repositories</h2><ul>${repos}</ul></div>` : ''}
        </div>
      </div>
      <a class="back" href="${pathOf(parent)}">‹ Back to ${esc(parent === 'campus' ? 'the campus' : PLACES[parent].title)}</a>
    </article>`;
}

function render() {
  const { id, chain } = current();
  const main = document.getElementById('main');
  renderCrumbs(chain);
  if (!id) {
    main.innerHTML = `<article class="page"><h1>No such place</h1><p class="tagline">Nothing is built at this address.</p><a class="back" href="#/">‹ Back to the campus</a></article>`;
    return;
  }
  const place = PLACES[id];
  main.innerHTML = place.scene ? renderScene(id, place) : renderPage(id, place);
  document.title = (id === 'campus' ? '' : place.title + ' · ') + 'Software Wrighter Research Campus';
  if (place.scene) wireScene();
  window.scrollTo(0, 0);
}

// ---------- Hover captions ----------
function wireScene() {
  const scene = document.getElementById('scene');
  const cap = document.getElementById('caption');
  const show = a => {
    const p = PLACES[a.dataset.id];
    const kids = (p.children || []).slice(0, 4).map(k => PLACES[k].title).join(' · ');
    const soon = p.status !== 'open';
    cap.className = 'caption' + (soon ? ' soon' : '');
    cap.innerHTML = `<div class="kind">${esc(p.kind)}</div><h3>${esc(p.title)}</h3><p>${esc(p.tagline)}</p>
      ${kids ? `<div class="children">${esc(kids)}${p.children.length > 4 ? ' · …' : ''}</div>` : ''}
      <div class="enter">${soon ? 'Opening soon' : 'Click to enter'}</div>`;
    const cx = a.dataset.cx / W, by = a.dataset.by / H;
    cap.style.left = (Math.min(Math.max(cx, 0.14), 0.86) * 100) + '%';
    if (by > 0.72) { cap.style.top = ''; cap.style.bottom = (100 - (by - 0.02) * 100 + 8) + '%'; }
    else { cap.style.bottom = ''; cap.style.top = (by * 100 + 1) + '%'; }
    cap.hidden = false;
  };
  const hide = () => { cap.hidden = true; };
  scene.querySelectorAll('.hot').forEach(a => {
    a.addEventListener('mouseenter', () => show(a));
    a.addEventListener('focus', () => show(a));
    a.addEventListener('mouseleave', hide);
    a.addEventListener('blur', hide);
  });
}

// ---------- Keys ----------
document.addEventListener('keydown', e => {
  if (e.target.matches('input, textarea')) return;
  if (e.key === 'Escape') { const { id } = current(); const p = id && parentOf(id); if (p) location.hash = pathOf(p); }
  if (e.key === 'h' || e.key === 'H') location.hash = '#/';
});

window.addEventListener('hashchange', render);
render();
</script>
